<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Categories Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Manage Categories</h1>
  <input type="text" id="title" placeholder="Category Title">
  <button id="addCategory">Add Category</button>

  <div id="categories"></div>

  <script>
    const token = localStorage.getItem('token');

    async function loadCategories() {
      const res = await fetch('http://localhost:3000/api/categories');
      const data = await res.json();
      const container = document.getElementById('categories');
      container.innerHTML = '';
      data.forEach(c => {
        const div = document.createElement('div');
        div.innerHTML = `${c.title} <button onclick="deleteCategory(${c.id})">Delete</button>`;
        container.appendChild(div);
      });
    }

    async function deleteCategory(id) {
      await fetch(`http://localhost:3000/api/categories/${id}`, {
        method:'DELETE',
        headers:{ 'Authorization': token }
      });
      loadCategories();
    }

    document.getElementById('addCategory').addEventListener('click', async () => {
      const title = document.getElementById('title').value;
      await fetch('http://localhost:3000/api/categories', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': token },
        body: JSON.stringify({ title })
      });
      loadCategories();
    });

    loadCategories();
  </script>
</body>
</html>
