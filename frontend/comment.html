<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Comments</h1>
  <input type="number" id="productId" placeholder="Product ID">
  <textarea id="commentText" placeholder="Write a comment..."></textarea>
  <button id="addComment">Add Comment</button>

  <div id="comments"></div>

  <script>
    const token = localStorage.getItem('token');

    async function loadComments(productId) {
      const res = await fetch(`http://localhost:3000/api/comments/${productId}`);
      const data = await res.json();
      const container = document.getElementById('comments');
      container.innerHTML = '';
      data.forEach(c => {
        const div = document.createElement('div');
        div.innerHTML = `<strong>${c.name}</strong>: ${c.text}`;
        container.appendChild(div);
      });
    }

    document.getElementById('addComment').addEventListener('click', async () => {
      const productId = document.getElementById('productId').value;
      const text = document.getElementById('commentText').value;
      await fetch('http://localhost:3000/api/comments', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': token },
        body: JSON.stringify({ product_id: productId, text })
      });
      loadComments(productId);
      document.getElementById('commentText').value = '';
    });
  </script>
</body>
</html>
