<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop - Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Products</a> |
    <a href="cart.html">Cart</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a> |
    <a href="admin.html">Admin</a>
  </nav>

  <h1>Products</h1>
  <input type="text" id="search" placeholder="Search products...">
  <div id="products"></div>

  <script>
    const token = localStorage.getItem('token');

    async function loadProducts(key='') {
      const res = await fetch(key ? `http://localhost:3000/api/products/search/${key}` : 'http://localhost:3000/api/products');
      const data = await res.json();
      const container = document.getElementById('products');
      container.innerHTML = '';
      data.forEach(p => {
        const div = document.createElement('div');
        div.innerHTML = `
          <h3>${p.title}</h3>
          <p>Price: $${p.price}</p>
          <button onclick="addToCart(${p.id}, '${p.title}', ${p.price})">Add to Cart</button>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('search').addEventListener('input', e => loadProducts(e.target.value));

    function addToCart(id, title, price) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push({id, title, price});
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Added to cart');
    }

    loadProducts();
  </script>
</body>
</html>
